# Interactive debug shell via tmate.
# Drops into a shell inside the devenv-c10s container so we can poke at
# the Copilot token exchange, opencode config, GitHub Models, etc. live.
#
# Usage: trigger via workflow_dispatch. The tmate SSH/web URL appears in
# the "Start tmate session" step log. Connect and experiment.
# The session stays open until you `touch /tmp/continue` or 30min elapses.

name: Debug (tmate)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to run: devenv-c10s container or plain ubuntu"
        required: false
        type: choice
        options:
          - devenv-c10s
          - plain-ubuntu
        default: devenv-c10s

permissions:
  contents: read

jobs:
  debug-devenv:
    if: ${{ inputs.runner == 'devenv-c10s' }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/bootc-dev/devenv-c10s:latest
      options: --privileged --user root
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Write tokens and run diagnostics
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BUILTIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$APP_TOKEN"     > /tmp/app-token
          echo "$BUILTIN_TOKEN" > /tmp/builtin-token
          chmod 600 /tmp/app-token /tmp/builtin-token

          echo "=== Token prefixes ==="
          echo -n "App token first 15 chars: "; head -c 15 /tmp/app-token; echo ""
          echo -n "Builtin token first 15 chars: "; head -c 15 /tmp/builtin-token; echo ""

          echo ""
          echo "=== Copilot token exchange with App token ==="
          COPILOT_APP=$(curl -s -H "Authorization: Bearer $(cat /tmp/app-token)" \
            -H 'User-Agent: GitHubCopilotChat/0.35.0' \
            -H 'Editor-Version: vscode/1.107.0' \
            -H 'Editor-Plugin-Version: copilot-chat/0.35.0' \
            -H 'Copilot-Integration-Id: vscode-chat' \
            https://api.github.com/copilot_internal/v2/token)
          echo "$COPILOT_APP" | jq .

          echo ""
          echo "=== Copilot token exchange with builtin GITHUB_TOKEN ==="
          COPILOT_BUILTIN=$(curl -s -H "Authorization: Bearer $(cat /tmp/builtin-token)" \
            -H 'User-Agent: GitHubCopilotChat/0.35.0' \
            -H 'Editor-Version: vscode/1.107.0' \
            -H 'Editor-Plugin-Version: copilot-chat/0.35.0' \
            -H 'Copilot-Integration-Id: vscode-chat' \
            https://api.github.com/copilot_internal/v2/token)
          echo "$COPILOT_BUILTIN" | jq .

          echo ""
          echo "=== GitHub Models with App token ==="
          MODELS_APP=$(curl -s -X POST -H "Authorization: Bearer $(cat /tmp/app-token)" \
            -H 'Content-Type: application/json' \
            https://models.github.ai/inference/chat/completions \
            -d '{"model":"openai/gpt-4.1-nano","messages":[{"role":"user","content":"say hello in 5 words"}],"max_tokens":20}')
          echo "$MODELS_APP" | jq .

          echo ""
          echo "=== GitHub Models with builtin token ==="
          MODELS_BUILTIN=$(curl -s -X POST -H "Authorization: Bearer $(cat /tmp/builtin-token)" \
            -H 'Content-Type: application/json' \
            https://models.github.ai/inference/chat/completions \
            -d '{"model":"openai/gpt-4.1-nano","messages":[{"role":"user","content":"say hello in 5 words"}],"max_tokens":20}')
          echo "$MODELS_BUILTIN" | jq .

          # Post results to issue #59 for easy retrieval
          APP_TOKEN_VAL=$(cat /tmp/app-token)
          APP_PREFIX=$(head -c 15 /tmp/app-token)
          BUILTIN_PREFIX=$(head -c 15 /tmp/builtin-token)
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY="## Diagnostic results for run [${GITHUB_RUN_ID}](${RUN_URL})

**App token prefix:** \`${APP_PREFIX}\`
**Builtin token prefix:** \`${BUILTIN_PREFIX}\`

### Copilot exchange (App token)
\`\`\`json
${COPILOT_APP}
\`\`\`

### Copilot exchange (Builtin GITHUB_TOKEN)
\`\`\`json
${COPILOT_BUILTIN}
\`\`\`

### GitHub Models (App token)
\`\`\`json
${MODELS_APP}
\`\`\`

### GitHub Models (Builtin token)
\`\`\`json
${MODELS_BUILTIN}
\`\`\`"

          curl -s -X POST \
            -H "Authorization: Bearer ${APP_TOKEN_VAL}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/59/comments" \
            -d "$(jq -n --arg body "$BODY" '{body: $body}')" \
            | jq '{id: .id, created_at: .created_at}'

          touch /tmp/continue

      - name: Start tmate session
        run: |
          # Install tmate if not present
          if ! command -v tmate &>/dev/null; then
            # tmate isn't in CentOS/RHEL repos - download the static binary
            TMATE_VER=2.4.0
            case "$(uname -m)" in
              x86_64)  TMATE_ARCH=amd64 ;;
              aarch64) TMATE_ARCH=arm64v8 ;;
              *)       TMATE_ARCH=$(uname -m) ;;
            esac
            curl -fsSL "https://github.com/tmate-io/tmate/releases/download/${TMATE_VER}/tmate-${TMATE_VER}-static-linux-${TMATE_ARCH}.tar.xz" \
              | tar -xJ --strip-components=1 -C /usr/local/bin "tmate-${TMATE_VER}-static-linux-${TMATE_ARCH}/tmate"
            chmod +x /usr/local/bin/tmate
          fi

          # Start the tmate session
          tmate -S /tmp/tmate.sock new-session -d -s debug
          tmate -S /tmp/tmate.sock wait tmate-ready

          # Get the connection strings
          SSH_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')

          echo "==================================="
          echo "tmate SSH: $SSH_URL"
          echo "tmate Web: $WEB_URL"
          echo "==================================="

          # Write to step summary so it's readable via API
          {
            echo "## tmate session"
            echo ""
            echo "**SSH:** \`${SSH_URL}\`"
            echo ""
            echo "**Web:** ${WEB_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          # Post the tmate URL as an issue comment so it's readable via REST API
          # while the job is still in progress (step summaries aren't visible until job end)
          APP_TOKEN=$(cat /tmp/app-token)
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST \
            -H "Authorization: Bearer ${APP_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/59/comments" \
            -d "{\"body\": \"## tmate session for run [${GITHUB_RUN_ID}](${RUN_URL})\n\n**SSH:** \`${SSH_URL}\`\n\n**Web:** ${WEB_URL}\n\nRun \`touch /tmp/continue\` to let the workflow finish.\"}"

          # Wait for /tmp/continue or 30 min timeout
          DEADLINE=$(($(date +%s) + 1800))
          while [ ! -f /tmp/continue ] && [ "$(date +%s)" -lt "$DEADLINE" ]; do
            echo "Waiting... SSH: $SSH_URL"
            sleep 5
          done

  debug-plain:
    if: ${{ inputs.runner == 'plain-ubuntu' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Write tokens and print hints
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BUILTIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$APP_TOKEN"     > /tmp/app-token
          echo "$BUILTIN_TOKEN" > /tmp/builtin-token
          chmod 600 /tmp/app-token /tmp/builtin-token
          echo "Tokens written. See devenv-c10s job hints for curl one-liners."

      - name: Start tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          timeout-minutes: 30
