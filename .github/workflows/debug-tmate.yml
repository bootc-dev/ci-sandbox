# Interactive debug shell via tmate, running inside the properly-initialized
# devenv-c10s devcontainer (postCreateCommand fires, userns-setup runs, etc.)
#
# Uses devcontainers/ci to spin up the container the same way Codespaces does,
# then drops into a tmate session for live experimentation.

name: Debug (tmate)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Write tokens for use inside the container
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BUILTIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$APP_TOKEN"     > /tmp/app-token
          echo "$BUILTIN_TOKEN" > /tmp/builtin-token
          chmod 600 /tmp/app-token /tmp/builtin-token

      - name: Start tmate session inside devcontainer
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            # Install tmate inside the container
            if ! command -v tmate &>/dev/null; then
              curl -Lo /tmp/tmate.tar.xz https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-static-linux-amd64.tar.xz
              tar -xf /tmp/tmate.tar.xz -C /tmp
              sudo mv /tmp/tmate-2.4.0-static-linux-amd64/tmate /usr/local/bin/tmate
            fi

            echo "=== Token prefixes ==="
            echo -n "app-token:     "; head -c 12 /tmp/app-token; echo
            echo -n "builtin-token: "; head -c 12 /tmp/builtin-token; echo

            echo ""
            echo "=== Useful one-liners ==="
            cat <<'HINTS'
            # Copilot token exchange:
            curl -s -H "Authorization: Bearer $(cat /tmp/app-token)" \
              -H 'User-Agent: GitHubCopilotChat/0.35.0' \
              -H 'Editor-Version: vscode/1.107.0' \
              -H 'Editor-Plugin-Version: copilot-chat/0.35.0' \
              -H 'Copilot-Integration-Id: vscode-chat' \
              https://api.github.com/copilot_internal/v2/token | jq .

            # GitHub Models:
            curl -s -X POST -H "Authorization: Bearer $(cat /tmp/app-token)" \
              -H 'Content-Type: application/json' \
              https://models.github.ai/inference/chat/completions \
              -d '{"model":"openai/gpt-4.1-nano","messages":[{"role":"user","content":"hello"}],"max_tokens":10}' | jq .

            # opencode version + providers:
            opencode --version
            HINTS

            # Start tmate and print connection info
            tmate -S /tmp/tmate.sock new-session -d
            tmate -S /tmp/tmate.sock wait tmate-ready
            echo ""
            echo "=== TMATE SESSION ==="
            tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
            tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
            echo "====================="

            # Wait until the user signals done or 25 minutes pass
            echo "Session open. Touch /tmp/continue to exit."
            timeout 1500 bash -c 'until [ -f /tmp/continue ]; do sleep 5; done' || true
            echo "Session ended."
