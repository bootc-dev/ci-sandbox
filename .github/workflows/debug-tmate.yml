# Quick opencode + GitHub Models probe — no tmate, just runs the test
# and posts results to the step summary (readable after completion).

name: Debug (tmate)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Write tokens
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          echo "$MODELS_TOKEN" > /tmp/models-token
          chmod 600 /tmp/models-token
          echo -n "models-token prefix: "; head -c 15 /tmp/models-token; echo

      - name: Test curl to GitHub Models directly
        run: |
          echo "## Direct curl test" >> "$GITHUB_STEP_SUMMARY"
          RESULT=$(curl -s --max-time 15 -X POST \
            -H "Authorization: Bearer $(cat /tmp/models-token)" \
            -H "Content-Type: application/json" \
            https://models.github.ai/inference/chat/completions \
            -d '{"model":"openai/gpt-4.1-nano","messages":[{"role":"user","content":"say hello in 3 words"}],"max_tokens":10}')
          echo "$RESULT" | jq .
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULT" | jq . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Write opencode config
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          mkdir -p ~/.config/opencode
          # Use @ai-sdk/openai-compatible (chat/completions API) not built-in openai
          # provider (which uses /responses — not supported by GitHub Models).
          # The baseURL must end in /v1 for the SDK to append /chat/completions correctly.
          jq -n --arg key "$MODELS_TOKEN" '{
            "$schema": "https://opencode.ai/config.json",
            "model": "github-models/gpt-4.1",
            "autoupdate": false,
            "permission": "allow",
            "provider": {
              "github-models": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "GitHub Models",
                "options": {
                  "baseURL": "https://models.github.ai/inference/v1",
                  "apiKey": $key
                },
                "models": {
                  "gpt-4.1": {
                    "name": "GPT-4.1 (GitHub Models)",
                    "attachment": true,
                    "reasoning": false,
                    "tool_call": true,
                    "temperature": false,
                    "limit": {"context": 1048576, "output": 32768}
                  }
                }
              }
            }
          }' > ~/.config/opencode/config.json
          echo "Config:"
          cat ~/.config/opencode/config.json

      - name: Test opencode run (90s timeout)
        run: |
          echo "## opencode output" >> "$GITHUB_STEP_SUMMARY"
          RESULT=$(timeout 90 opencode run \
            --print-logs \
            --dangerously-skip-permissions \
            "say hello in exactly 3 words, nothing else" 2>&1) || true
          echo "$RESULT"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
