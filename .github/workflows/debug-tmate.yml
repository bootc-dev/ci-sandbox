# Quick opencode + GitHub Models probe — no tmate, just runs the test
# and posts results to the step summary (readable after completion).

name: Debug (tmate)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Test curl to GitHub Models directly
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          echo "## Direct curl test" >> "$GITHUB_STEP_SUMMARY"
          RESULT=$(curl -s --max-time 15 -X POST \
            -H "Authorization: Bearer $MODELS_TOKEN" \
            -H "Content-Type: application/json" \
            https://models.github.ai/inference/chat/completions \
            -d '{"model":"openai/gpt-4.1","messages":[{"role":"user","content":"say hello in 3 words"}],"max_tokens":10}')
          echo "$RESULT" | jq .
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULT" | jq . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Test opencode run (90s timeout)
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          # Use OPENCODE_CONFIG_CONTENT to inject config as env var — avoids
          # any file precedence issues and works cleanly on a fresh runner.
          # Main model: gpt-4o (solid, free-tier GitHub Models).
          # Sub-tasks (title/compaction/summary): gpt-4o-mini.
          # Uses @ai-sdk/openai-compatible (chat/completions) not the built-in
          # openai provider (which uses /responses, unsupported by GitHub Models).
          export OPENCODE_CONFIG_CONTENT=$(jq -cn --arg key "$MODELS_TOKEN" '{
            "$schema": "https://opencode.ai/config.json",
            "model": "github-models/gpt-4.1",
            "autoupdate": false,
            "permission": "allow",
            "agent": {
              "compaction": {"model": "github-models/gpt-4.1-mini"},
              "title":      {"model": "github-models/gpt-4.1-mini"},
              "summary":    {"model": "github-models/gpt-4.1-mini"}
            },
            "provider": {
              "github-models": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "GitHub Models",
                "options": {
                  "baseURL": "https://models.github.ai/inference/v1",
                  "apiKey": $key
                },
                "models": {
                  "gpt-4.1": {
                    "id": "openai/gpt-4.1",
                    "name": "GPT-4.1",
                    "attachment": true, "reasoning": false, "tool_call": true,
                    "temperature": false, "limit": {"context": 1047576, "output": 32768}
                  },
                  "gpt-4.1-mini": {
                    "id": "openai/gpt-4.1-mini",
                    "name": "GPT-4.1-mini",
                    "attachment": true, "reasoning": false, "tool_call": true,
                    "temperature": false, "limit": {"context": 1047576, "output": 32768}
                  }
                }
              }
            }
          }')

          echo "## opencode output" >> "$GITHUB_STEP_SUMMARY"
          RESULT=$(timeout 90 opencode run \
            --model github-models/gpt-4.1 \
            --print-logs \
            --dangerously-skip-permissions \
            "say hello in exactly 3 words, nothing else" 2>&1) || true
          echo "$RESULT"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
