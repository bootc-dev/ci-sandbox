# Agentic CI monitor: polls recent CI failures / merge queue and summarises
# them using opencode backed by GitHub Copilot (no external API key needed).
#
# How the Copilot auth works:
#   The opencode-copilot-auth plugin is installed at startup.  It reads
#   ~/.local/share/opencode/auth.json where we pre-populate the App token as
#   the OAuth refresh token.  On first use the plugin calls
#   https://api.github.com/copilot_internal/v2/token to exchange that token
#   for a short-lived Copilot bearer, then uses api.githubcopilot.com for
#   inference.  This requires the organisation to have Copilot Enterprise
#   (available free to CNCF maintainers via contribute.cncf.io).
#
# Required secrets:
#   APP_ID / APP_PRIVATE_KEY  - GitHub App with contents:write + pull-requests:write
#                               (same secrets used by scheduled-release.yml)
#
# Inputs:
#   dry_run      (bool, default true)  - analyse only, no commit/PR
#   push_to_main (bool, default false) - commit directly to main instead of PR
#                                        (App token must have bypass-branch-protection)
#   extra_prompt (string, optional)    - additional context for the agent

name: Agentic CI Monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: analyse and report, but do not commit or open a PR"
        required: false
        type: boolean
        default: true
      push_to_main:
        description: "Commit directly to main instead of opening a PR (requires App token bypass rights)"
        required: false
        type: boolean
        default: false
      extra_prompt:
        description: "Extra instructions for the AI agent (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    # ghcr.io/bootc-dev/devenv-c10s ships opencode-ai (npm), gh CLI, jj,
    # nu, just, podman, Rust, Go, etc.  Built from bootc-dev/infra.
    container:
      image: ghcr.io/bootc-dev/devenv-c10s:latest
      options: --privileged  # needed for rootless podman inside the image

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "bootc-ci-bot[bot]"
          git config user.email "bootc-ci-bot[bot]@users.noreply.github.com"

      # -----------------------------------------------------------------------
      # Install the opencode-copilot-auth plugin and configure credentials.
      #
      # The plugin is a thin npm package that handles the GitHub OAuth →
      # Copilot token exchange.  We inject the App token as the OAuth refresh
      # token; the plugin calls copilot_internal/v2/token on first inference.
      # -----------------------------------------------------------------------
      - name: Install opencode-copilot-auth plugin
        run: npm install -g opencode-copilot-auth

      - name: Configure opencode Copilot auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p ~/.local/share/opencode
          # Inject App token as the OAuth refresh token.
          # The plugin will exchange this for a short-lived Copilot bearer.
          printf '{"github-copilot":{"type":"oauth","refresh":"%s","access":"","expires":0}}\n' \
            "$APP_TOKEN" > ~/.local/share/opencode/auth.json

      - name: Write opencode.json
        run: |
          cat > opencode.json <<'EOF'
{
  "$schema": "https://opencode.ai/config.json",
  "model": "github-copilot/claude-sonnet-4-5",
  "autoupdate": false,
  "permission": "allow",
  "plugins": ["opencode-copilot-auth"]
}
EOF

      # -----------------------------------------------------------------------
      # Collect recent CI failures and merge-queue state via gh CLI
      # -----------------------------------------------------------------------
      - name: Collect recent CI failures
        id: collect
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh run list \
            --repo "$REPO" \
            --branch main \
            --limit 20 \
            --json databaseId,name,status,conclusion,createdAt,headSha,headBranch,url \
            --jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled")]' \
            > /tmp/failed-runs.json

          echo "=== Failed/cancelled runs (last 20 on main) ==="
          jq -r '.[] | "  \(.createdAt)  \(.name)  \(.conclusion)  sha=\(.headSha[0:8])  \(.url)"' \
            /tmp/failed-runs.json || true

          gh api "repos/$REPO/pulls?state=open&per_page=20" \
            --jq '[.[] | {number, title, draft, mergeable_state, labels: [.labels[].name], url: .html_url}]' \
            > /tmp/open-prs.json
          echo "=== Open PRs ==="
          jq -r '.[] | "  #\(.number) [\(.mergeable_state)] \(.title)"' /tmp/open-prs.json || true

          gh api "repos/$REPO/merge-queue/groups" 2>/dev/null \
            | jq '.' > /tmp/merge-queue.json || echo '[]' > /tmp/merge-queue.json

      # -----------------------------------------------------------------------
      # Run opencode analysis via the github-copilot provider
      # -----------------------------------------------------------------------
      - name: Analyse with opencode (Copilot)
        id: analysis
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          EXTRA="${{ github.event.inputs.extra_prompt }}"

          # Build the prompt from collected data
          {
            echo "You are a CI reliability engineer reviewing the bootc project."
            echo ""
            echo "## Recent failed/cancelled runs on main"
            echo '```json'
            cat /tmp/failed-runs.json
            echo '```'
            echo ""
            echo "## Open pull requests"
            echo '```json'
            cat /tmp/open-prs.json
            echo '```'
            echo ""
            echo "## Merge queue groups"
            echo '```json'
            cat /tmp/merge-queue.json
            echo '```'
            if [ -n "$EXTRA" ]; then
              echo ""
              echo "## Additional context"
              echo "$EXTRA"
            fi
            echo ""
            echo "Write a concise report (≤500 words, plain markdown):"
            echo "1. Summarise failure patterns."
            echo "2. Distinguish transient failures from probable regressions."
            echo "3. Name the likely commit/PR for any regression."
            echo "4. Recommend one concrete next action per issue group."
          } > /tmp/prompt.txt

          opencode run \
            --dangerously-skip-permissions \
            "$(cat /tmp/prompt.txt)" \
            > /tmp/ci-analysis.md

          echo "=== Analysis ==="
          cat /tmp/ci-analysis.md

      # -----------------------------------------------------------------------
      # Upload as artifact (always, even on dry run)
      # -----------------------------------------------------------------------
      - name: Upload CI analysis artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-analysis
          path: /tmp/ci-analysis.md
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # Push directly to main (dry_run=false, push_to_main=true)
      # Requires the GitHub App to have "bypass branch protection" in the
      # branch ruleset settings (confirmed working in this sandbox).
      # -----------------------------------------------------------------------
      - name: Commit analysis directly to main
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.push_to_main == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p docs/ci-reports
          cp /tmp/ci-analysis.md "docs/ci-reports/${DATE}-ci-analysis.md"
          git add "docs/ci-reports/${DATE}-ci-analysis.md"
          git commit -m "ci: Automated CI failure analysis ${DATE}

Generated by the agentic-ci-monitor workflow (push_to_main=true).

Assisted-by: OpenCode (github-copilot/claude-sonnet-4-5)"
          git push origin main

      # -----------------------------------------------------------------------
      # Open a PR (dry_run=false, push_to_main=false — the safe default)
      # -----------------------------------------------------------------------
      - name: Open PR with analysis report
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.push_to_main != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          TS=$(date -u +%Y%m%d-%H%M%S)
          BRANCH="ci-analysis/${TS}"
          git checkout -b "$BRANCH"
          mkdir -p docs/ci-reports
          cp /tmp/ci-analysis.md "docs/ci-reports/${DATE}-ci-analysis.md"
          git add "docs/ci-reports/${DATE}-ci-analysis.md"
          git commit -m "ci: Automated CI failure analysis ${DATE}

Generated by the agentic-ci-monitor workflow.

Assisted-by: OpenCode (github-copilot/claude-sonnet-4-5)"
          git push origin "$BRANCH"
          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "ci: Automated CI failure analysis ${DATE}" \
            --body "$(printf '%s\n\n---\n_Generated by the [agentic-ci-monitor](.github/workflows/agentic-ci-monitor.yml) workflow._' "$(cat /tmp/ci-analysis.md)")"
