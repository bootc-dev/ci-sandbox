# Agentic CI monitor: polls recent CI failures / merge queue and summarises
# them using opencode via GitHub Models (models.github.ai).
#
# Auth: MODELS_TOKEN is a fine-grained PAT with organization_models:read on
# bootc-dev. It's used as the API key for the github-models opencode provider
# which talks to https://models.github.ai/inference (OpenAI-compatible API).
#
# Required secrets:
#   APP_ID / APP_PRIVATE_KEY  - GitHub App (contents:write + pull-requests:write)
#   MODELS_TOKEN              - fine-grained PAT with organization_models:read

name: Agentic CI Monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: analyse only, do not commit or open a PR"
        required: false
        type: boolean
        default: true
      push_to_main:
        description: "Commit directly to main instead of opening a PR"
        required: false
        type: boolean
        default: false
      extra_prompt:
        description: "Extra instructions for the AI agent (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "bootc-ci-bot[bot]"
          git config user.email "bootc-ci-bot[bot]@users.noreply.github.com"

      - name: Install opencode
        run: npm install -g opencode-ai

      # Configure opencode to use GitHub Models via a custom provider.
      # models.github.ai exposes an OpenAI-compatible API; we point the
      # built-in openai provider at it using MODELS_TOKEN as the key.
      - name: Configure opencode for GitHub Models
        env:
          MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          mkdir -p ~/.config/opencode
          jq -n '{
            "$schema": "https://opencode.ai/config.json",
            "model": "openai/gpt-4.1",
            "autoupdate": false,
            "permission": "allow",
            "providers": {
              "openai": {
                "name": "GitHub Models",
                "api": "https://models.github.ai/inference",
                "models": {
                  "gpt-4.1": {
                    "id": "openai/gpt-4.1",
                    "name": "GPT-4.1 via GitHub Models",
                    "attachment": true,
                    "reasoning": false,
                    "tool_call": true,
                    "temperature": false,
                    "limit": {"context": 1048576, "output": 32768}
                  }
                }
              }
            }
          }' > ~/.config/opencode/config.json
          echo "opencode config written"
          # opencode reads the openai provider key from OPENAI_API_KEY
          echo "OPENAI_API_KEY=${MODELS_TOKEN}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Collect CI failure data
      # -----------------------------------------------------------------------
      - name: Collect recent CI failures
        id: collect
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh run list \
            --repo "$REPO" \
            --branch main \
            --limit 20 \
            --json databaseId,name,status,conclusion,createdAt,headSha,url \
            --jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled")]' \
            > /tmp/failed-runs.json

          echo "=== Failed/cancelled runs ==="
          jq -r '.[] | "  \(.createdAt)  \(.name)  \(.conclusion)  sha=\(.headSha[0:8])"' \
            /tmp/failed-runs.json || true

          gh api "repos/$REPO/pulls?state=open&per_page=20" \
            --jq '[.[] | {number, title, draft, mergeable_state, labels: [.labels[].name]}]' \
            > /tmp/open-prs.json

          gh api "repos/$REPO/merge-queue/groups" 2>/dev/null \
            | jq '.' > /tmp/merge-queue.json || echo '[]' > /tmp/merge-queue.json

      # -----------------------------------------------------------------------
      # Run opencode analysis
      # -----------------------------------------------------------------------
      - name: Analyse with opencode
        env:
          EXTRA: ${{ github.event.inputs.extra_prompt }}
        run: |
          set -euo pipefail

          {
            echo "You are a CI reliability engineer reviewing the bootc project."
            echo ""
            echo "## Recent failed/cancelled runs on main"
            echo '```json'
            cat /tmp/failed-runs.json
            echo '```'
            echo ""
            echo "## Open pull requests"
            echo '```json'
            cat /tmp/open-prs.json
            echo '```'
            echo ""
            echo "## Merge queue groups"
            echo '```json'
            cat /tmp/merge-queue.json
            echo '```'
            if [ -n "${EXTRA:-}" ]; then
              echo ""
              echo "## Additional context"
              echo "$EXTRA"
            fi
            echo ""
            echo "Write a concise CI health report (<=500 words, plain markdown):"
            echo "1. Summarise failure patterns."
            echo "2. Distinguish transient failures from probable regressions."
            echo "3. Name likely culprit commits/PRs for any regression."
            echo "4. Recommend one concrete next action per issue group."
          } > /tmp/prompt.txt

          opencode run \
            --dangerously-skip-permissions \
            "$(cat /tmp/prompt.txt)" \
            > /tmp/ci-analysis.md

          echo "=== Analysis ==="
          cat /tmp/ci-analysis.md

      - name: Upload CI analysis artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-analysis
          path: /tmp/ci-analysis.md
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # Push directly to main (push_to_main=true, dry_run=false)
      # -----------------------------------------------------------------------
      - name: Commit analysis directly to main
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.push_to_main == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p docs/ci-reports
          cp /tmp/ci-analysis.md "docs/ci-reports/${DATE}-ci-analysis.md"
          git add "docs/ci-reports/${DATE}-ci-analysis.md"
          git commit -m "ci: Automated CI failure analysis ${DATE} (push_to_main)"
          git push origin main

      # -----------------------------------------------------------------------
      # Open a PR (default: dry_run=false, push_to_main=false)
      # -----------------------------------------------------------------------
      - name: Open PR with analysis report
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.push_to_main != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="ci-analysis/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          mkdir -p docs/ci-reports
          cp /tmp/ci-analysis.md "docs/ci-reports/${DATE}-ci-analysis.md"
          git add "docs/ci-reports/${DATE}-ci-analysis.md"
          git commit -m "ci: Automated CI failure analysis ${DATE}"
          git push origin "$BRANCH"
          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "ci: Automated CI failure analysis ${DATE}" \
            --body "$(printf '%s\n\n---\n_Generated by the [agentic-ci-monitor](.github/workflows/agentic-ci-monitor.yml) workflow._' "$(cat /tmp/ci-analysis.md)")"
