# Agentic CI monitor: polls merge queue / recent CI failures and opens a PR
# (or pushes directly to main) with a summary report.
#
# Design notes:
#   - Runs inside ghcr.io/bootc-dev/devenv-c10s (the c10s devenv from
#     https://github.com/bootc-dev/infra) which already ships opencode-ai
#     and the gh CLI.
#   - Uses the repo's existing GitHub App token (APP_ID / APP_PRIVATE_KEY,
#     also used by scheduled-release.yml) so PRs are attributed to the bot
#     and the token can bypass branch protection when the org permits it.
#   - opencode provider: github-copilot, authenticated by writing a minimal
#     ~/.local/share/opencode/auth.json with the App token as the OAuth
#     refresh token.  No separate Anthropic/OpenAI key is required.
#   - The push_to_main input (default false) commits directly to main when
#     the App token has bypass-branch-protection rights; otherwise a PR is
#     opened.  dry_run (default true) skips both commit paths entirely.
#
# Required secrets:
#   APP_ID / APP_PRIVATE_KEY  - GitHub App with contents:write + pull-requests:write

name: Agentic CI Monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: analyse and report, but do not open a PR or push"
        required: false
        type: boolean
        default: true
      push_to_main:
        description: "Push directly to main instead of opening a PR (requires App token bypass)"
        required: false
        type: boolean
        default: false
      extra_prompt:
        description: "Extra instructions for the AI agent (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    # The c10s devenv image (built from bootc-dev/infra) ships:
    #   opencode-ai (npm), gh CLI, goose, jj, nu, just, podman, Rust, Go, etc.
    container:
      image: ghcr.io/bootc-dev/devenv-c10s:latest
      options: --privileged  # needed for rootless podman inside the image

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "bootc-ci-bot[bot]"
          git config user.email "bootc-ci-bot[bot]@users.noreply.github.com"

      # -----------------------------------------------------------------------
      # Authenticate opencode with the github-copilot provider.
      #
      # opencode stores OAuth credentials in ~/.local/share/opencode/auth.json.
      # The github-copilot plugin uses auth.refresh as "Authorization: Bearer
      # <token>".  The App token issued above has Copilot API access when the
      # organisation has Copilot Enterprise, so we inject it as the refresh
      # token — no device-code login flow needed.
      # -----------------------------------------------------------------------
      - name: Configure opencode github-copilot auth
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p ~/.local/share/opencode
          printf '{"github-copilot":{"type":"oauth","refresh":"%s","access":"%s","expires":0}}\n' \
            "$APP_TOKEN" "$APP_TOKEN" \
            > ~/.local/share/opencode/auth.json
          echo "opencode auth.json written"

      # -----------------------------------------------------------------------
      # Write a minimal opencode.json that points at github-copilot.
      # Uses gpt-4.1 (a solid, widely-available Copilot model).  If the org
      # exposes Claude via Copilot the model ID would be e.g.
      # github-copilot/claude-sonnet-4-5 — adjust as needed.
      # -----------------------------------------------------------------------
      - name: Write opencode.json
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "github-copilot/gpt-4.1",
            "autoupdate": false,
            "snapshot": false,
            "permission": "allow"
          }
          EOF

      # -----------------------------------------------------------------------
      # Collect recent CI failures and merge-queue state
      # -----------------------------------------------------------------------
      - name: Collect recent CI failures
        id: collect
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Last 20 workflow runs on main that failed or were cancelled
          gh run list \
            --repo "$REPO" \
            --branch main \
            --limit 20 \
            --json databaseId,name,status,conclusion,createdAt,headSha,headBranch,url \
            --jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled")]' \
            > /tmp/failed-runs.json

          echo "=== Failed/cancelled runs (last 20 on main) ==="
          jq -r '.[] | "  \(.createdAt)  \(.name)  \(.conclusion)  sha=\(.headSha[0:8])  \(.url)"' \
            /tmp/failed-runs.json || true

          # Open PRs and their merge state
          gh api "repos/$REPO/pulls?state=open&per_page=20" \
            --jq '[.[] | {number, title, draft, mergeable_state, labels: [.labels[].name], url: .html_url}]' \
            > /tmp/open-prs.json
          echo "=== Open PRs ==="
          jq -r '.[] | "  #\(.number) [\(.mergeable_state)] \(.title)"' /tmp/open-prs.json || true

          # Merge queue entries (if any)
          gh api "repos/$REPO/merge-queue/groups" 2>/dev/null \
            | jq '.' > /tmp/merge-queue.json || echo '[]' > /tmp/merge-queue.json

      # -----------------------------------------------------------------------
      # Analyse with opencode (github-copilot provider, no external API key)
      # opencode run writes its final response to stdout; we capture it.
      # -----------------------------------------------------------------------
      - name: Analyse with opencode
        id: analysis
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXTRA: ${{ github.event.inputs.extra_prompt }}
        run: |
          set -euo pipefail

          FAILED=$(cat /tmp/failed-runs.json)
          PRS=$(cat /tmp/open-prs.json)
          MQ=$(cat /tmp/merge-queue.json)

          MESSAGE="You are a CI reliability engineer reviewing the bootc project.

          ## Recent failed/cancelled runs on main
          \`\`\`json
          $FAILED
          \`\`\`

          ## Open pull requests (merge state)
          \`\`\`json
          $PRS
          \`\`\`

          ## Merge queue groups
          \`\`\`json
          $MQ
          \`\`\`

          ${EXTRA:+Additional context: $EXTRA}

          Please write a concise report (≤500 words, plain markdown) that:
          1. Summarises the failure patterns.
          2. Distinguishes transient failures (runner flakes, network, rate-limits) from probable code regressions.
          3. If any regression looks likely, names the probable commit or PR.
          4. Recommends one concrete next action per issue group."

          opencode run \
            --dangerously-skip-permissions \
            "$MESSAGE" \
            > /tmp/ci-analysis.md

          echo "=== Analysis output ==="
          cat /tmp/ci-analysis.md

      # -----------------------------------------------------------------------
      # Upload the analysis as a workflow artifact (always, even on dry run)
      # -----------------------------------------------------------------------
      - name: Upload CI analysis artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-analysis
          path: /tmp/ci-analysis.md
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # Push directly to main (requires App token with bypass-branch-protection)
      # Only runs when: dry_run=false AND push_to_main=true
      # -----------------------------------------------------------------------
      - name: Commit analysis directly to main
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.push_to_main == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          DATE=$(date -u +%Y-%m-%d)

          mkdir -p docs/ci-reports
          REPORT="docs/ci-reports/${DATE}-ci-analysis.md"
          cp /tmp/ci-analysis.md "$REPORT"

          git add "$REPORT"
          git commit -m "ci: Add automated CI failure analysis ${DATE}

          Generated by the agentic-ci-monitor workflow (push_to_main=true).

          Assisted-by: OpenCode (github-copilot/gpt-4.1)"

          git push origin main

      # -----------------------------------------------------------------------
      # Open a PR that records the analysis in docs/ci-reports/
      # Only runs when: dry_run=false AND push_to_main=false (the default)
      # -----------------------------------------------------------------------
      - name: Open PR with analysis report
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.push_to_main != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          DATE=$(date -u +%Y-%m-%d)
          TS=$(date -u +%Y%m%d-%H%M%S)
          BRANCH="ci-analysis/${TS}"

          git checkout -b "$BRANCH"

          mkdir -p docs/ci-reports
          REPORT="docs/ci-reports/${DATE}-ci-analysis.md"
          cp /tmp/ci-analysis.md "$REPORT"

          git add "$REPORT"
          git commit -m "ci: Add automated CI failure analysis ${DATE}

          Generated by the agentic-ci-monitor workflow.

          Assisted-by: OpenCode (github-copilot/gpt-4.1)"

          git push origin "$BRANCH"

          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "ci: Automated CI failure analysis ${DATE}" \
            --body "$(printf '%s\n\n---\n_Generated by the [agentic-ci-monitor](.github/workflows/agentic-ci-monitor.yml) workflow._' "$(cat /tmp/ci-analysis.md)")"
