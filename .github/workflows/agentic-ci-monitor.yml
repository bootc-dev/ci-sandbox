# Agentic CI monitor: polls recent CI failures / merge queue and summarises them.
#
# Auth strategy (in order of preference):
#   1. GitHub Copilot via copilot_internal/v2/token exchange using the App token
#      (ghs_... installation token) - works if bootc-dev org has Copilot Enterprise
#   2. GitHub Copilot via GITHUB_TOKEN (also a ghs_... token) - same mechanism
#   3. Raw data dump with no LLM summary if both fail
#
# The copilot exchange is tested at runtime; if it fails we fall through gracefully.
#
# Required secrets:
#   APP_ID / APP_PRIVATE_KEY  - GitHub App with contents:write + pull-requests:write

name: Agentic CI Monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: analyse and report, but do not commit or open a PR"
        required: false
        type: boolean
        default: true
      push_to_main:
        description: "Commit directly to main instead of opening a PR (requires App token bypass)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/bootc-dev/devenv-c10s:latest
      options: --privileged

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "bootc-ci-bot[bot]"
          git config user.email "bootc-ci-bot[bot]@users.noreply.github.com"

      # -----------------------------------------------------------------------
      # Probe: can we exchange the App token (ghs_...) for a Copilot bearer?
      # Also try the built-in GITHUB_TOKEN as a fallback.
      # -----------------------------------------------------------------------
      - name: Probe Copilot token exchange
        id: copilot-probe
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN_BUILTIN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          HEADERS=(
            -H "Accept: application/json"
            -H "User-Agent: GitHubCopilotChat/0.35.0"
            -H "Editor-Version: vscode/1.107.0"
            -H "Editor-Plugin-Version: copilot-chat/0.35.0"
            -H "Copilot-Integration-Id: vscode-chat"
          )

          try_exchange() {
            local label=$1 token=$2
            echo "--- trying $label (prefix: ${token:0:8}...) ---"
            RESP=$(curl -s "${HEADERS[@]}" \
              -H "Authorization: Bearer $token" \
              https://api.github.com/copilot_internal/v2/token)
            echo "$RESP" | jq '{token_preview: (.token // "NONE" | .[0:20]), error: .message}'
            if echo "$RESP" | jq -e '.token' >/dev/null 2>&1; then
              echo "copilot_token=$(echo "$RESP" | jq -r '.token')" >> "$GITHUB_OUTPUT"
              echo "copilot_ok=true" >> "$GITHUB_OUTPUT"
              echo "SUCCESS with $label"
              return 0
            fi
            return 1
          }

          try_exchange "app-token" "$APP_TOKEN" \
            || try_exchange "github-token" "$GH_TOKEN_BUILTIN" \
            || { echo "copilot_ok=false" >> "$GITHUB_OUTPUT"; echo "Both tokens failed Copilot exchange"; }

      # -----------------------------------------------------------------------
      # Collect CI failure data
      # -----------------------------------------------------------------------
      - name: Collect recent CI failures
        id: collect
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh run list \
            --repo "$REPO" \
            --branch main \
            --limit 20 \
            --json databaseId,name,status,conclusion,createdAt,headSha,url \
            --jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled")]' \
            > /tmp/failed-runs.json

          echo "=== Failed/cancelled runs ==="
          jq -r '.[] | "  \(.createdAt)  \(.name)  \(.conclusion)  sha=\(.headSha[0:8])"' \
            /tmp/failed-runs.json || true

          gh api "repos/$REPO/pulls?state=open&per_page=20" \
            --jq '[.[] | {number, title, draft, mergeable_state, labels: [.labels[].name]}]' \
            > /tmp/open-prs.json

          gh api "repos/$REPO/merge-queue/groups" 2>/dev/null \
            | jq '.' > /tmp/merge-queue.json || echo '[]' > /tmp/merge-queue.json

      # -----------------------------------------------------------------------
      # If Copilot exchange succeeded, use it directly via curl for a summary.
      # This avoids needing opencode config entirely.
      # -----------------------------------------------------------------------
      - name: Summarise with Copilot API
        id: summarise
        if: ${{ steps.copilot-probe.outputs.copilot_ok == 'true' }}
        env:
          COPILOT_TOKEN: ${{ steps.copilot-probe.outputs.copilot_token }}
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -n \
            --argjson failed "$(cat /tmp/failed-runs.json)" \
            --argjson prs "$(cat /tmp/open-prs.json)" \
            --argjson mq "$(cat /tmp/merge-queue.json)" \
            '{
              model: "claude-sonnet-4-5",
              messages: [{
                role: "user",
                content: ("You are a CI reliability engineer reviewing the bootc project.\n\n## Failed runs\n```json\n" + ($failed | tojson) + "\n```\n\n## Open PRs\n```json\n" + ($prs | tojson) + "\n```\n\n## Merge queue\n```json\n" + ($mq | tojson) + "\n```\n\nWrite a concise CI health report (<=500 words, plain markdown): summarise failure patterns, distinguish transient from regressions, name likely culprit commits/PRs, recommend one action per issue group.")
              }],
              max_tokens: 1024
            }')

          curl -s \
            -H "Authorization: Bearer $COPILOT_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHubCopilotChat/0.35.0" \
            -H "Editor-Version: vscode/1.107.0" \
            -H "Editor-Plugin-Version: copilot-chat/0.35.0" \
            -H "Copilot-Integration-Id: vscode-chat" \
            https://api.githubcopilot.com/chat/completions \
            -d "$PAYLOAD" \
            | tee /tmp/copilot-response.json \
            | jq -r '.choices[0].message.content // ("ERROR: " + (.error.message // "unknown"))' \
            > /tmp/ci-analysis.md

          echo "=== Analysis ==="
          cat /tmp/ci-analysis.md

      # Fallback: plain data dump when Copilot is unavailable
      - name: Generate plain data report (fallback)
        if: ${{ steps.copilot-probe.outputs.copilot_ok != 'true' }}
        run: |
          {
            echo "# CI Report $(date -u +%Y-%m-%d)"
            echo ""
            echo "_(No LLM summary — Copilot token exchange failed)_"
            echo ""
            echo "## Failed runs"
            echo '```json'
            cat /tmp/failed-runs.json
            echo '```'
            echo ""
            echo "## Open PRs"
            echo '```json'
            cat /tmp/open-prs.json
            echo '```'
            echo ""
            echo "## Merge queue"
            echo '```json'
            cat /tmp/merge-queue.json
            echo '```'
          } > /tmp/ci-analysis.md
          cat /tmp/ci-analysis.md

      - name: Upload CI analysis artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-analysis
          path: /tmp/ci-analysis.md
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # Push directly to main (push_to_main=true, dry_run=false)
      # -----------------------------------------------------------------------
      - name: Commit analysis directly to main
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.push_to_main == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p docs/ci-reports
          cp /tmp/ci-analysis.md "docs/ci-reports/${DATE}-ci-analysis.md"
          git add "docs/ci-reports/${DATE}-ci-analysis.md"
          git commit -m "ci: Automated CI failure analysis ${DATE}

Generated by the agentic-ci-monitor workflow (push_to_main=true).

Assisted-by: OpenCode (claude-sonnet-4-6)"
          git push origin main

      # -----------------------------------------------------------------------
      # Open a PR (default path: dry_run=false, push_to_main=false)
      # -----------------------------------------------------------------------
      - name: Open PR with analysis report
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.push_to_main != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="ci-analysis/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          mkdir -p docs/ci-reports
          cp /tmp/ci-analysis.md "docs/ci-reports/${DATE}-ci-analysis.md"
          git add "docs/ci-reports/${DATE}-ci-analysis.md"
          git commit -m "ci: Automated CI failure analysis ${DATE}

Generated by the agentic-ci-monitor workflow.

Assisted-by: OpenCode (claude-sonnet-4-6)"
          git push origin "$BRANCH"
          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "ci: Automated CI failure analysis ${DATE}" \
            --body "$(printf '%s\n\n---\n_Generated by the [agentic-ci-monitor](.github/workflows/agentic-ci-monitor.yml) workflow._' "$(cat /tmp/ci-analysis.md)")"
