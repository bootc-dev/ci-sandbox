# Final end-to-end validation of the actual proposed upstream patch (to
# replace bootc PR #2392 with the real root-cause fix -- see AGENTS.md and
# repro-chunkah-no-host-systemd.yml for the full investigation history).
#
# Unlike the earlier repro-chunkah-*.yml variants (which used a trimmed,
# simplified stand-in script and only exercised the chunkah step), this
# workflow:
#   - Runs the OUTER `sudo podman run --privileged --pid=host ...`
#     invocation with the EXACT flags the proposed ci.yml patch leaves
#     behind (no `-v /run/dbus:/run/dbus -v /run/systemd:/run/systemd`,
#     and no `mount_program = ""` native-overlay workaround from PR #2392
#     -- that change is NOT part of our proposed fix, so validating
#     without it is more faithful to what's actually being proposed).
#   - Runs repro-patched-priv-integration.sh, which reuses the EXACT
#     patched command text (systemd-run deleted, chunkah debug logging
#     added) from both `systemd-run`-bearing sections of
#     priv-integration.sh: the derived-image podman build + two skopeo
#     copy calls (upstream lines ~103-113), and the chunkah build
#     (upstream lines ~151-162), including the real
#     `--mount=type=image,src=...,dst=/chunkah` syntax rather than a bind
#     mount substitute.
#
# See repro-patched-priv-integration.sh for exactly what's included vs.
# skipped (the ostree-sysroot-dependent lines in between, which have no
# systemd-run call sites and aren't affected by this fix).
#
# RESULT (run 32401788878): success in 3m5s, no hang, no watchdog stall.
# `podman build -t localhost/fcos-derived .` and both `skopeo copy`
# calls (all with systemd-run deleted) succeeded, and the chunkah
# `podman run` produced a valid 1766224384-byte nonostree.ociarchive.
# capture-chunkah-ns.sh confirmed the chunkah podman run process's
# mnt/ipc namespaces matched the outer container's own entrypoint, not
# the host's -- consistent with repro-chunkah-no-host-systemd.yml's
# earlier finding, now confirmed against the real patched command text
# for both systemd-run sections instead of a simplified stand-in. This
# is the final validation before proposing the patch upstream.
name: Repro patched priv-integration.sh (final validation)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Bootc Ubuntu Setup
        uses: bootc-dev/actions/bootc-ubuntu-setup@main

      - name: Ensure strace is available (for hang diagnostics, in case this also hangs)
        run: |
          set -x
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y strace
          fi
          strace -V

      - name: Verify image exists and pull
        run: |
          set -xeuo pipefail
          IMAGE=ghcr.io/bootc-dev/dev-bootc:centos-10
          skopeo inspect docker://${IMAGE} | jq '.Digest, .Labels'
          sudo podman pull ${IMAGE}
          sudo podman tag ${IMAGE} localhost/bootc

      - name: Run repro-patched-priv-integration.sh with the exact proposed outer podman flags (no /run/dbus, no /run/systemd)
        run: |
          set -xeuo pipefail
          sudo bash ./crates/ostree-ext/ci/capture-chunkah-ns.sh /var/tmp/ns-verify.txt 1200 &
          ns_watcher_pid=$!

          rc=0
          ./crates/ostree-ext/ci/run-with-hang-watchdog.sh \
            /var/tmp/patched-repro.log 300 1200 -- \
            sudo podman run --privileged --pid=host \
              -v /:/run/host \
              -v $(pwd):/src:ro \
              -v /var/tmp:/var/tmp \
              --tmpfs /var/lib/containers \
              localhost/bootc /src/crates/ostree-ext/ci/repro-patched-priv-integration.sh \
            || rc=$?

          wait "$ns_watcher_pid" || true
          exit "$rc"

      - name: Dump full script log (always, for diagnosis regardless of watchdog exit path)
        if: always()
        run: |
          set -x
          if [ -f /var/tmp/patched-repro.log ]; then
            cat /var/tmp/patched-repro.log
          else
            echo "no /var/tmp/patched-repro.log found"
          fi

      - name: Namespace-escape verification (chunkah podman run vs. outer container vs. host PID 1)
        if: always()
        run: |
          set -x
          if [ -f /var/tmp/ns-verify.txt ]; then
            cat /var/tmp/ns-verify.txt
          else
            echo "no /var/tmp/ns-verify.txt found (poller never wrote output)"
          fi

      - name: Verify derived-image artifacts and nonostree.ociarchive were actually created
        if: always()
        run: |
          set -x
          ls -la /var/tmp/derived.oci /var/tmp/derived.dir /var/tmp/nonostree.ociarchive || \
            echo "MISSING: one or more expected artifacts were not created"
          if [ -s /var/tmp/nonostree.ociarchive ]; then
            echo "OK: /var/tmp/nonostree.ociarchive exists and is non-empty ($(stat -c%s /var/tmp/nonostree.ociarchive) bytes)"
          else
            echo "FAIL: /var/tmp/nonostree.ociarchive is missing or empty"
            exit 1
          fi
