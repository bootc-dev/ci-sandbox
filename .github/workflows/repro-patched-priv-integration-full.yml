# Full end-to-end validation of the actual proposed upstream patch
# (already pushed to bootc-dev/bootc PR #2392), this time against the
# ENTIRE, UNMODIFIED (except for the patch) upstream
# crates/ostree-ext/ci/priv-integration.sh -- not the trimmed two-section
# stand-in used by repro-patched-priv-integration.yml.
#
# repro-patched-priv-integration.yml already validated the two sections
# of priv-integration.sh that actually contain `systemd-run -dP --wait`
# call sites (the derived-image build/skopeo copy, and the chunkah
# build), by deliberately skipping the ~100 lines of `ostree
# admin`/`ostree container image` sysroot setup at the top of the
# script, on the theory that those lines have no systemd-run call sites
# and don't touch dbus/systemd.
#
# Source-level analysis of libostree (ostree-sysroot-deploy.c,
# ostree-sysroot.c) shows the only dbus/systemd dependency in that code
# path is `_ostree_sysroot_ensure_finalize_staged_service` inside
# `ostree_sysroot_stage_tree_with_options`, which only runs when
# `sysroot.booted_deployment().is_some()` -- itself gated on the
# sysroot's path having the same device/inode as the calling process's
# real `/` (see `root_is_sysroot` in ostree_sysroot_initialize). Since
# priv-integration.sh always uses `sysroot=/run/host` (a bind-mounted
# view of the host's root, distinct from the container's own /), that
# condition should structurally never be true here. This workflow proves
# that empirically by running the WHOLE script, not just the
# systemd-run-bearing sections.
#
# See crates/ostree-ext/ci/priv-integration-patched-full.sh for exactly
# what was changed (only the 4 `systemd-run -dP --wait ` prefixes
# deleted; everything else is byte-for-byte upstream bootc-dev/bootc
# commit fceedf69901f8e0ede49d9ce1974a76a39dd3eb1).
name: Repro patched priv-integration.sh (full script, final validation)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Bootc Ubuntu Setup
        uses: bootc-dev/actions/bootc-ubuntu-setup@main

      - name: Ensure strace is available (for hang diagnostics, in case this also hangs)
        run: |
          set -x
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y strace
          fi
          strace -V

      - name: Verify image exists and pull
        run: |
          set -xeuo pipefail
          IMAGE=ghcr.io/bootc-dev/dev-bootc:centos-10
          skopeo inspect docker://${IMAGE} | jq '.Digest, .Labels'
          sudo podman pull ${IMAGE}
          sudo podman tag ${IMAGE} localhost/bootc

      - name: Run the FULL patched priv-integration.sh with the exact proposed outer podman flags (no /run/dbus, no /run/systemd)
        run: |
          set -xeuo pipefail
          rc=0
          ./crates/ostree-ext/ci/run-with-hang-watchdog.sh \
            /var/tmp/full-patched-repro.log 300 2100 -- \
            sudo podman run --privileged --pid=host \
              -v /:/run/host \
              -v $(pwd):/src:ro \
              -v /var/tmp:/var/tmp \
              --tmpfs /var/lib/containers \
              localhost/bootc /src/crates/ostree-ext/ci/priv-integration-patched-full.sh \
            || rc=$?
          exit "$rc"

      - name: Dump full script log (always, for diagnosis regardless of watchdog exit path)
        if: always()
        run: |
          set -x
          if [ -f /var/tmp/full-patched-repro.log ]; then
            cat /var/tmp/full-patched-repro.log
          else
            echo "no /var/tmp/full-patched-repro.log found"
          fi

      - name: Check for the final success line
        if: always()
        run: |
          set -x
          grep -q '^ok privileged integration$' /var/tmp/full-patched-repro.log && \
            echo "FOUND: final 'ok privileged integration' success line" || \
            (echo "MISSING: final success line not found" && exit 1)

      - name: Grep for any systemd/dbus-related error strings anywhere in the log
        if: always()
        run: |
          set -x
          if grep -inE 'systemctl|dbus|Failed to connect to bus|finalize-staged' /var/tmp/full-patched-repro.log; then
            echo "FOUND systemd/dbus-related strings above -- inspect closely, this needs scrutiny"
          else
            echo "CONFIRMED: zero systemd/dbus-related strings found anywhere in the log"
          fi
