name: Test GitHub Models API

on:
  push:
    branches:
      - main

permissions:
  contents: read
  models: read
  issues: write

jobs:
  test-github-models:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEST_ISSUE_NUMBER: 59
    steps:
      - name: Install openai package
        run: pip install openai

      - name: Call GitHub Models API
        id: llm
        run: |
          python3 << 'EOF'
          import openai, os, sys

          token = os.environ.get("GITHUB_TOKEN")
          if not token:
              print("ERROR: GITHUB_TOKEN not set")
              sys.exit(1)

          print(f"Token starts with: {token[:20]}...")

          client = openai.OpenAI(
              base_url="https://models.inference.ai.azure.com",
              api_key=token,
          )

          try:
              resp = client.chat.completions.create(
                  model="gpt-4o-mini",
                  messages=[{"role": "user", "content": "Say hello from GitHub Models in one sentence."}],
                  max_tokens=50,
              )
              content = resp.choices[0].message.content
              print("SUCCESS! Response:")
              print(content)
              print(f"Model used: {resp.model}")

              # Write to GITHUB_OUTPUT for use in next step
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  # Use a delimiter to handle multi-line safely
                  f.write("llm_response<<LLM_EOF\n")
                  f.write(content + "\n")
                  f.write("LLM_EOF\n")
          except Exception as e:
              print(f"ERROR: {e}")
              sys.exit(1)
          EOF

      - name: Update issue comment
        run: |
          SENTINEL="<!-- test-github-models-comment -->"
          TIMESTAMP=$(date -u)
          LLM_RESPONSE="${{ steps.llm.outputs.llm_response }}"

          BODY="${SENTINEL}
          ## GitHub Models Test

          Last run: ${TIMESTAMP}
          LLM said: ${LLM_RESPONSE}"

          # Find existing comment with the sentinel
          COMMENT_ID=$(gh api "repos/bootc-dev/ci-sandbox/issues/${TEST_ISSUE_NUMBER}/comments" \
            --jq '[.[] | select(.body | contains("'"${SENTINEL}"'"))] | .[0].id // empty')

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/bootc-dev/ci-sandbox/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="${BODY}"
            echo "Updated existing comment ID: ${COMMENT_ID}"
          else
            gh api "repos/bootc-dev/ci-sandbox/issues/${TEST_ISSUE_NUMBER}/comments" \
              -X POST -f body="${BODY}"
            echo "Created new comment on issue #${TEST_ISSUE_NUMBER}"
          fi

  test-goose:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      models: read
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # Goose OpenAI provider picks up OPENAI_API_KEY and OPENAI_HOST
      OPENAI_HOST: https://models.inference.ai.azure.com
      # Disable session naming to avoid extra model calls
      GOOSE_DISABLE_SESSION_NAMING: "true"
      TEST_ISSUE_NUMBER: 59
    steps:
      - name: Install Goose CLI
        run: |
          set -e
          echo "Downloading Goose v1.33.1 for Linux x86_64..."
          curl -fsSL \
            https://github.com/aaif-goose/goose/releases/download/v1.33.1/goose-x86_64-unknown-linux-gnu.tar.gz \
            -o goose.tar.gz
          tar -xzf goose.tar.gz
          sudo mv goose /usr/local/bin/goose
          chmod +x /usr/local/bin/goose
          rm goose.tar.gz
          goose --version

      - name: Configure Goose for GitHub Models
        run: |
          mkdir -p ~/.config/goose
          # Write config with correct YAML indentation (no leading spaces)
          cat > ~/.config/goose/config.yaml << 'EOF'
          GOOSE_PROVIDER: openai
          GOOSE_MODEL: gpt-4o-mini
          GOOSE_DISABLE_SESSION_NAMING: "true"
          EOF
          # Strip leading whitespace (heredoc indentation artifact)
          sed -i 's/^          //' ~/.config/goose/config.yaml
          echo "Goose config written:"
          cat ~/.config/goose/config.yaml

      - name: Debug - test raw API call
        run: |
          echo "Testing raw API call to GitHub Models..."
          echo "GITHUB_TOKEN starts with: ${GITHUB_TOKEN:0:15}..."
          # Use GITHUB_TOKEN (auto-injected) directly
          curl -s -o /tmp/api_test.json -w "\nHTTP_CODE:%{http_code}\n" \
            -X POST "https://models.inference.ai.azure.com/v1/chat/completions" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}],"max_tokens":10}'
          echo "Raw API response:"
          cat /tmp/api_test.json

      - name: Run Goose non-interactively
        id: goose_run
        run: |
          echo "Running Goose with GitHub Models backend..."
          echo "OPENAI_HOST=${OPENAI_HOST}"
          # Set OPENAI_API_KEY from GITHUB_TOKEN for Goose
          export OPENAI_API_KEY="${GITHUB_TOKEN}"
          export GOOSE_PROVIDER__API_KEY="${GITHUB_TOKEN}"
          set +e
          GOOSE_OUTPUT=$(goose run \
            --no-session \
            --provider openai \
            --model gpt-4o-mini \
            -t "Write a one-sentence greeting mentioning that you are running inside GitHub Actions. Then stop." \
            2>&1)
          EXIT_CODE=$?
          set -e

          echo "Exit code: $EXIT_CODE"
          echo "--- Goose output ---"
          echo "$GOOSE_OUTPUT"
          echo "--- End output ---"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Goose run failed with exit code $EXIT_CODE"
            exit 1
          fi

          # Write output for next step
          {
            echo "goose_output<<GOOSE_EOF"
            echo "$GOOSE_OUTPUT"
            echo "GOOSE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post Goose result to issue
        run: |
          SENTINEL="<!-- test-goose-comment -->"
          TIMESTAMP=$(date -u)
          GOOSE_OUTPUT="${{ steps.goose_run.outputs.goose_output }}"

          BODY="${SENTINEL}
          ## Goose Agent Test (GitHub Actions + GitHub Models)

          Last run: ${TIMESTAMP}

          **Goose output:**
          \`\`\`
          ${GOOSE_OUTPUT}
          \`\`\`"

          # Find existing comment with the sentinel
          COMMENT_ID=$(gh api "repos/bootc-dev/ci-sandbox/issues/${TEST_ISSUE_NUMBER}/comments" \
            --jq '[.[] | select(.body | contains("'"${SENTINEL}"'"))] | .[0].id // empty')

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/bootc-dev/ci-sandbox/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="${BODY}"
            echo "Updated existing Goose comment ID: ${COMMENT_ID}"
          else
            gh api "repos/bootc-dev/ci-sandbox/issues/${TEST_ISSUE_NUMBER}/comments" \
              -X POST -f body="${BODY}"
            echo "Created new Goose comment on issue #${TEST_ISSUE_NUMBER}"
          fi
